services:
  mongodb:
    build:
      context: .
      dockerfile: docker/mongodb/Dockerfile
    image: aseman-mongodb:9.0.4
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: aseman
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
      MONGO_REPLICA_SET_KEY: ${MONGO_REPLICA_SET_KEY:?Set MONGO_REPLICA_SET_KEY in .env}
    ports:
      - '127.0.0.1:${MONGO_HOST_PORT:-27018}:27017'
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./docker/mongodb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    networks:
      - aseman_network

  mongodb-init:
    image: mongo:9.0.4
    restart: 'no'
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - ./docker/mongodb/init-replica-set.sh:/scripts/init-replica-set.sh:ro
    entrypoint: ['/bin/bash', '/scripts/init-replica-set.sh']
    networks:
      - aseman_network

  mongodb-backup:
    image: mongodb/mongodb-database-tools:100.20.0-ubuntu2204
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups/mongodb:/backups
      - ./docker/mongodb-backup/backup.sh:/scripts/backup.sh:ro
    entrypoint: ['/bin/bash', '/scripts/backup.sh']
    networks:
      - aseman_network

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: aseman-backend:1.0.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: 'mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/aseman?authSource=aseman&replicaSet=rs0'
      CORS_ORIGINS: ${DOCKER_CORS_ORIGINS:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER: ${SMS_SENDER:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - aseman_network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: aseman-frontend:1.0.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_HOST_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - aseman_network

volumes:
  mongodb_data:
  mongodb_config:
  uploads_data:

networks:
  aseman_network:
    driver: bridge
